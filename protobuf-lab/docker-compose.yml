version: '3.8'

networks:
  integration-net:
    driver: bridge

services:
  receiver:
    build: ./server-b-receiver
    container_name: receiver-container
    networks:
      - integration-net
    ports:
      - "50051:50051"

  sender:
    build: ./server-a-sender
    container_name: sender-container
    networks:
      - integration-net
    stdin_open: true
    tty: true
    depends_on:
      - receiver
